name = "oeis-lt"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["OEISLt"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.20.1"

[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli.git"
rev = "v4.20.0"

[[lean_lib]]
name = "OEISLt"

[[lean_exe]]
supportInterpreter = true
name = "oeis-lt"
root = "Main"
needs = ["OEISLt"]
